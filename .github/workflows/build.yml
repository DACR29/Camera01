name: Compilar APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compilar
        run: |
          unzip -q *.zip
          cd CamaraDibujo
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CamaraDibujo-apk
          path: CamaraDibujo/app/build/outputs/apk/release/*.apk
